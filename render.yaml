services:
  - type: worker
    name: cineverse-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: DB_CHANNEL_ID
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_LINK
        sync: false
      - key: WELCOME_IMAGE_URL
        sync: false
